# 复制为当前工作目录的 config.toml 后填写。明文密钥不会进入 worker 运行档案；
# 不要提交复制后含真实密钥的 config.toml。
url = "https://api.example.com/v1"
api_key = ""
model = "model-name"
context_window_tokens = 131072
max_output_tokens = 16384

[execution]
llm_attempts = 3
identical_tool_call_limit = 3
context_safety_tokens = 4096

[tools]
max_result_bytes = 32768
# max_in_flight 省略时使用可用 CPU 数；也可由操作者显式设置。

[tools.search]
enabled = true
max_matches = 100
max_context_lines = 20
# max_result_bytes 与 max_in_flight 可覆盖 [tools]。

[tools.read]
enabled = true
# max_result_bytes 与 max_in_flight 可覆盖 [tools]。

[cache]
enabled = true
max_bytes = 67108864

# Streamable HTTP MCP 示例。默认暴露 tools/list 发现的全部工具；需要主动筛选时才写 enabled_tools。
[mcp_servers.http_example]
enabled = false
url = "https://example.com/mcp"
bearer_token = ""
bearer_token_env = "EXAMPLE_TOKEN"
headers = { "x-client" = "formic" }
# header_env 的键是 HTTP header，值是本机环境变量名；环境变量值覆盖 headers。
header_env = { "x-tenant" = "EXAMPLE_TENANT" }
tool_aliases = {}
session_scope = "job"
max_in_flight = 1
startup_timeout_sec = 30
tool_timeout_sec = 300
max_result_bytes = 32768
reconnect = false

[mcp_servers.http_example.tool_limits.search]
max_in_flight = 1
max_result_bytes = 65536

# stdio MCP 示例。command 与 url 互斥；命令不会经过 shell 拼接。
[mcp_servers.stdio_example]
enabled = false
command = "mcp-server"
args = ["--stdio"]
env = { LOG_LEVEL = "warn" }
# env_vars 的键是子进程环境变量，值是本机环境变量名；环境变量值覆盖 env。
env_vars = { SERVICE_TOKEN = "EXAMPLE_TOKEN" }
tool_aliases = {}
session_scope = "unit"
max_in_flight = 2
startup_timeout_sec = 30
tool_timeout_sec = 300
max_result_bytes = 32768
reconnect = false
