[package]
name = "formic"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "批处理自主执行内核：文件进、记录出"
license = "AGPL-3.0-only"

[dependencies]
bytes = "1"
cap-std = "4.0.2"
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
fs2 = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
http = "1"
process-wrap = { version = "9.1.0", features = ["tokio1"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rmcp = { version = "=3.1.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
same-file = "1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sse-stream = "0.2"
jsonschema = { version = "=0.49.7", default-features = false }
thiserror = "2"
tiktoken-rs = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process", "io-util", "net"] }
tokio-util = "0.7"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3"
