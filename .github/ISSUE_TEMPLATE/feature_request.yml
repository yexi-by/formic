name: 功能建议
description: 提议由 Formic 内核负责的新行为或现有行为变更
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Formic 只负责通用批处理运行时。分片规划、任务领域规则、结果汇总和跨运行续跑由调用方负责。请先说明真实使用场景，再说明为什么需要修改内核。

  - type: textarea
    id: outcome
    attributes:
      label: 需要达成的用户结果
      description: 谁在什么场景下需要什么结果？请描述使用者和作业，不要只给出类名、字段名或实现方案。
      placeholder: 当……时，我需要……，以便……
    validations:
      required: true

  - type: textarea
    id: limitation
    attributes:
      label: 当前限制
      description: 现有行为为什么无法产生该结果？如有临时方案，请说明它在哪些条件下失效。
    validations:
      required: true

  - type: dropdown
    id: owner
    attributes:
      label: 预期责任方
      description: 选择最接近的责任边界，并在下一项说明理由。
      options:
        - Formic 运行时
        - 调用方
        - LLM 供应商或网关
        - 尚不确定
    validations:
      required: true

  - type: textarea
    id: ownership_reason
    attributes:
      label: 为什么应由该责任方处理
      description: 说明需要维护的规则、状态或资源限制，以及为什么现有边界不能处理。
    validations:
      required: true

  - type: textarea
    id: observable_behavior
    attributes:
      label: 建议的可观察行为
      description: 从 CLI 调用方视角说明输入、成功结果、失败结果和必须保持的现有行为。
      placeholder: |
        输入：……
        成功：……
        失败：……
        保持不变：……
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 实际样本或测量证据
      description: 如果建议涉及并发、超时、容量、重试、缓存或持久化，请提供能够说明限制的真实数据；其他建议可留空。

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方法
      description: 说明是否能在 task.md、plan.jsonl、结果汇总程序或 LLM 网关中完成，以及没有采用的原因。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已阅读 README 中的适用范围和调用方责任。
          required: true
        - label: 我已搜索现有 Issue，没有找到相同建议。
          required: true
